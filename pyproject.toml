[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tenhz"
version = "2.2.0"
description = "MinEl and TiTen QRS detection from a 10 Hz min-max representation of the ECG (Numba)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Titus Jayarathna" }]
requires-python = ">=3.9"
classifiers = [
"Development Status :: 4 - Beta",
"Intended Audience :: Science/Research",
"Intended Audience :: Healthcare Industry",
"License :: OSI Approved :: Apache Software License",
"Programming Language :: Python :: 3",
"Topic :: Scientific/Engineering :: Bio-Informatics",
"Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.58"]

[project.optional-dependencies]
data = ["wfdb>=4.1", "pandas>=2.0"]
benchmark = ["wfdb>=4.1", "pandas>=2.0", "neurokit2", "py-ecg-detectors"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
